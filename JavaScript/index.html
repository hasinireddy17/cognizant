<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Portal</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<header>
    <h1>🌟 Community Event Portal</h1>
    <p>Discover Amazing Events Around You</p>
</header>

<section class="stats">
    <div class="box">
        <h2 id="totalEvents">0</h2>
        <p>Total Events</p>
    </div>

    <div class="box">
        <h2 id="totalSeats">0</h2>
        <p>Available Seats</p>
    </div>

    <div class="box">
        <h2 id="registeredUsers">0</h2>
        <p>Registrations</p>
    </div>
</section>

<section class="controls">

    <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="Music">Music</option>
        <option value="Workshop">Workshop</option>
        <option value="Sports">Sports</option>
        <option value="Arts">Arts</option>
        <option value="Food">Food</option>
        <option value="Business">Business</option>
    </select>

    <input
        type="text"
        id="searchBox"
        placeholder="Search Event..."
    >
</section>

<div id="loader">Loading Events...</div>

<div id="eventsContainer"></div>

<section class="form-section">

    <h2>Event Registration</h2>

    <form id="registrationForm">

        <input
            type="text"
            name="name"
            placeholder="Enter Name"
        >

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
        >

        <select name="event" id="eventSelect"></select>

        <button type="submit">
            Submit Registration
        </button>

    </form>

    <div id="error"></div>

</section>

<footer>
    <p>© 2026 Community Event Portal</p>
</footer>

<script src="main.js"></script>

</body>
</html>
