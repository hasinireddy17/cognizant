<!DOCTYPE html>
<html lang="en">
<head>

<title>Exercise 8.2</title>

</head>
<body>

<div class="container mt-5">

<form>

    <div class="form-floating mb-3">

        <input type="password" class="form-control" id="password" placeholder="Password">

    <button class="btn btn-success">
        Login
    </button>

</form>

</div>

</body>
</html>
